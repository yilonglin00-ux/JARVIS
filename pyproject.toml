[project]
name = "jarvis"
version = "0.2.0"
description = "Persönlicher KI-Assistent — Host-Core (Sprache, Tools, Agenten, Memory)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "anyio>=4.6",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.optional-dependencies]
# Echte Provider — für Tests nicht erforderlich, dort laufen die Fakes.
providers = [
    "anthropic>=0.40",
    "deepgram-sdk>=3.7",
    "elevenlabs>=1.13",
]
# Getrennt von [providers], weil Playwright einen Chromium-Download nach
# sich zieht: `playwright install chromium`. Ohne dieses Extra laufen die
# Browser-Werkzeuge nicht, alles andere schon.
browser = [
    "playwright>=1.49",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
]

[project.scripts]
jarvis = "jarvis.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "BLE", "RUF"]
ignore = [
    "B008", # FastAPI-Dependencies stehen per Konvention im Default-Argument
    # Der Code ist auf Deutsch kommentiert. Umlaute, Halbgeviertstriche und
    # typografische Anführungszeichen sind hier Absicht, keine Verwechslung.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests dürfen synchron auf das Dateisystem schauen. Dort geht es um den
# Nachweis, dass eine Datei da ist oder nicht — nicht um die Latenz einer
# Ereignisschleife.
"tests/**" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
packages = ["jarvis"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["anthropic.*", "deepgram.*", "elevenlabs.*", "playwright.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:jarvis.*"]
